<head>

  <title>Keyframe Scheduler - Lichtsteuerung</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border: #e0e0e0;
      --accent: #2196F3;
      --accent-hover: #1976D2;
      --danger: #f44336;
      --success: #4CAF50;
      --warning: #ff9800;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1a1a;
        --bg-secondary: #2a2a2a;
        --bg-card: #2a2a2a;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --border: #404040;
        --shadow: 0 2px 8px rgba(0,0,0,0.5);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-icon {
      font-size: 20px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    input, select, button {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: var(--border);
    }

    button.danger {
      background: var(--danger);
    }

    button.success {
      background: var(--success);
    }

    button.small {
      padding: 6px 10px;
      font-size: 13px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keyframes-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .keyframes-table th {
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 12px 8px;
      border-bottom: 2px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .keyframes-table td {
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .keyframes-table tr:hover {
      background: var(--bg-secondary);
    }

    .keyframes-table input,
    .keyframes-table select {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
    }

    .keyframes-table input[type="number"] {
      width: 80px;
    }

    .keyframes-table input[type="time"] {
      width: 100px;
    }

    .drag-handle {
      cursor: grab;
      font-size: 18px;
      color: var(--text-secondary);
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .row-number {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .chart-container {
      position: relative;
      height: 400px;
      margin-top: 16px;
    }

    canvas {
      max-height: 100%;
    }

    .info-box {
      background: var(--bg-secondary);
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 16px;
    }

    .info-box.warning {
      border-left-color: var(--warning);
    }

    .info-box strong {
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.instant {
      background: #e3f2fd;
      color: #1565c0;
    }

    .badge.transition {
      background: #f3e5f5;
      color: #6a1b9a;
    }

    .badge.interpolate {
      background: #e8f5e9;
      color: #2e7d32;
    }

    @media (prefers-color-scheme: dark) {
      .badge.instant {
        background: #1565c0;
        color: #e3f2fd;
      }
      .badge.transition {
        background: #6a1b9a;
        color: #f3e5f5;
      }
      .badge.interpolate {
        background: #2e7d32;
        color: #e8f5e9;
      }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    details {
      margin-top: 16px;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      padding: 10px;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      user-select: none;
    }

    summary:hover {
      background: var(--border);
    }

    .json-box {
      width: 100%;
      min-height: 200px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 12px;
      padding: 12px;
      margin-top: 12px;
      resize: vertical;
      background: var(--bg-secondary);
    }

    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item {
      display: flex;
      gap: 6px;
    }

    .stat-label {
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }

      .keyframes-table {
        font-size: 12px;
      }

      .keyframes-table th,
      .keyframes-table td {
        padding: 8px 4px;
      }
    }

    .mode-help {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>

    <script>
    function switchLanguage(lang) {
      const filename = lang === 'en' ? 'webapp_en.html' : 'webapp.html';
      // For local files, replace the current filename
      const current = window.location.href;
      const lastSlash = current.lastIndexOf('/');
      const lastBackslash = current.lastIndexOf('\\');
      const sep = Math.max(lastSlash, lastBackslash);
      if (sep > 0) {
        window.location.href = current.substring(0, sep + 1) + filename;
      } else {
        window.location.href = filename;
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = JSON.parse(saved);
          updateUI();
        } else {
          // Load example preset on first visit
          loadPreset('example');
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    function updateUI() {
      document.getElementById('stepMinutes').value = state.stepMinutes;
      document.getElementById('horizonHours').value = state.horizonHours;
      document.getElementById('wrapAround').value = state.wrapAround;
      document.getElementById('scheduleName').value = state.scheduleName || 'My Schedule';
      renderKeyframes();
      renderChart();
      updateJsonOutput();
    }
    
    function updateScheduleName(value) {
      state.scheduleName = value.trim() || 'My Schedule';
      saveState();
    }

    // ============================================================================
    // KEYFRAME MANAGEMENT
    // ============================================================================

    function addKeyframe() {
      const now = new Date();
      const time = `${pad2(now.getHours())}:00`;
      
      state.keyframes.push({
        time,
        kelvin: 4000,
        dim: 80,
        mode: 'instant',
        transitionSeconds: 300,
        transitionDirection: 'after',
        curve: 'linear'
      });
      
      saveState();
      updateUI();
    }

    function deleteKeyframe(index) {
      if (confirm('Keyframe wirklich lÃ¶schen?')) {
        state.keyframes.splice(index, 1);
        saveState();
        updateUI();
      }
    }

    function updateKeyframe(index, field, value) {
      if (!state.keyframes[index]) return;
      
      if (field === 'kelvin') {
        value = clamp(parseInt(value) || 2000, 2000, 6500);
      } else if (field === 'dim') {
        value = clamp(parseInt(value) || 0, 0, 100);
      } else if (field === 'transitionSeconds') {
        const numValue = parseInt(value) || 0;
        // If negative value, convert to positive and set direction to "before"
        if (numValue < 0) {
          state.keyframes[index].transitionSeconds = Math.abs(numValue);
          state.keyframes[index].transitionDirection = 'before';
          saveState();
          updateUI();
          return;
        }
        value = Math.max(0, numValue);
      }
      
      state.keyframes[index][field] = value;
      saveState();
      
      // For text input fields: don't re-render table, only update chart/json
      // This preserves focus in input fields
      if (field === 'time' || field === 'kelvin' || field === 'dim') {
        // Debounced chart update to avoid too many updates while typing
        if (window.chartUpdateTimeout) clearTimeout(window.chartUpdateTimeout);
        window.chartUpdateTimeout = setTimeout(() => {
          renderChart();
          updateJsonOutput();
        }, 300); // Wait 300ms after last keystroke
      } else {
        // For dropdowns (mode, curve, direction): full update is OK
        updateUI();
      }
    }

    function updateTransitionTime(index, container) {
      const inputs = container.querySelectorAll('input[type="number"]');
      const hours = Math.max(0, Math.min(23, parseInt(inputs[0].value) || 0));
      const minutes = Math.max(0, Math.min(59, parseInt(inputs[1].value) || 0));
      const seconds = Math.max(0, Math.min(59, parseInt(inputs[2].value) || 0));
      
      const totalSeconds = hours * 3600 + minutes * 60 + seconds;
      
      state.keyframes[index].transitionSeconds = totalSeconds;
      saveState();
      updateUI();
    }

    function handleTransitionInput(index, inputElement) {
      const value = parseInt(inputElement.value);
      if (!isNaN(value) && value < 0) {
        // Live feedback: change direction dropdown immediately
        state.keyframes[index].transitionDirection = 'before';
      }
    }

    function sortKeyframesByTime() {
      state.keyframes.sort((a, b) => parseTime(a.time) - parseTime(b.time));
      saveState();
      updateUI();
    }

    function loadPreset(presetName) {
      if (PRESETS[presetName]) {
        state.keyframes = JSON.parse(JSON.stringify(PRESETS[presetName]));
        saveState();
        updateUI();
      }
    }

                       placeholder="S"
                       title="${showTransition ? 'Sekunden' : t('mode_interpolate') + ' - nicht verwendet'}"
                       style="width: 45px;"
                       onchange="updateTransitionTime(${index}, this.parentElement)">
              </div>
            </td>
            <td style="${!showTransition ? 'opacity: 0.3;' : ''}">
              <select onchange="updateKeyframe(${index}, 'transitionDirection', this.value)"
                      ${!showTransition ? 'disabled' : ''}
                      title="${showTransition ? t('th_direction') : t('mode_interpolate') + ' - nicht verwendet'}">
                <option value="after" ${(kf.transitionDirection || 'after') === 'after' ? 'selected' : ''}>${t('dir_after')}</option>
                <option value="before" ${kf.transitionDirection === 'before' ? 'selected' : ''}>${t('dir_before')}</option>
              </select>
            </td>
            <td>
              <select onchange="updateKeyframe(${index}, 'curve', this.value)"
                      ${!showCurve ? 'disabled' : ''}>
                <option value="linear" ${kf.curve === 'linear' ? 'selected' : ''}>${t('curve_linear')}</option>
                <option value="sinus" ${kf.curve === 'sinus' ? 'selected' : ''}>${t('curve_sinus')}</option>
              </select>
            </td>
            <td>
              <button class="small danger" onclick="deleteKeyframe(${index})">
                ðï¸
              </button>
            </td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      container.innerHTML = html;
      
      // Add drag and drop handlers
      setupDragAndDrop();
    }

    function setupDragAndDrop() {
      const rows = document.querySelectorAll('.keyframes-table tbody tr');
      let draggedIndex = null;

      rows.forEach((row, index) => {
        row.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          row.style.opacity = '0.5';
        });

        row.addEventListener('dragend', (e) => {
          row.style.opacity = '1';
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        row.addEventListener('drop', (e) => {
          e.preventDefault();
          if (draggedIndex !== null && draggedIndex !== index) {
            const temp = state.keyframes[draggedIndex];
            state.keyframes.splice(draggedIndex, 1);
            state.keyframes.splice(index, 0, temp);
            saveState();
            updateUI();
          }
        });
      });
    }

    // ============================================================================
    // SCHEDULER LOGIC
    // ============================================================================

    function evaluateSchedule(timeMinutes) {
      if (state.keyframes.length === 0) {
        return { kelvin: 4000, dim: 50, transition: 300 };
      }

      // Sort by time for evaluation
      const sorted = [...state.keyframes].sort((a, b) => parseTime(a.time) - parseTime(b.time));
      
      // Find relevant keyframes
      let prevKf = null;
      let nextKf = null;

      for (let i = 0; i < sorted.length; i++) {
        const kfTime = parseTime(sorted[i].time);
        
        if (kfTime <= timeMinutes) {
          prevKf = { ...sorted[i], timeMinutes: kfTime, index: i };
        }
        
        if (kfTime > timeMinutes && !nextKf) {
          nextKf = { ...sorted[i], timeMinutes: kfTime, index: i };
        }
      }

      // Wrap around handling
      if (state.wrapAround) {
        if (!prevKf) {
          prevKf = { ...sorted[sorted.length - 1], timeMinutes: parseTime(sorted[sorted.length - 1].time) - 1440 };
        }
        if (!nextKf) {
          nextKf = { ...sorted[0], timeMinutes: parseTime(sorted[0].time) + 1440 };
        }
      }

      // No previous keyframe and no wrap
      if (!prevKf) {
        if (nextKf) {
          return { 
            kelvin: nextKf.kelvin, 
            dim: nextKf.dim, 
            transition: nextKf.transitionSeconds 
          };
        }
        return { kelvin: 4000, dim: 50, transition: 300 };
      }

      // Handle different modes
      if (prevKf.mode === 'instant') {
        return { 
          kelvin: prevKf.kelvin, 
          dim: prevKf.dim, 
          transition: prevKf.transitionSeconds 
        };
      }

      if (prevKf.mode === 'transition') {
        const direction = prevKf.transitionDirection || 'after';
        const transitionDuration = prevKf.transitionSeconds / 60; // in minutes
        
        let transitionStart, transitionEnd;
        
        if (direction === 'before') {
          transitionEnd = prevKf.timeMinutes;
          transitionStart = transitionEnd - transitionDuration;
        } else {
          transitionStart = prevKf.timeMinutes;
          transitionEnd = transitionStart + transitionDuration;
        }
        
        if (timeMinutes >= transitionStart && timeMinutes <= transitionEnd) {
          // During transition
          const t = (timeMinutes - transitionStart) / (transitionEnd - transitionStart);
          const progress = prevKf.curve === 'sinus' ? easeSinus(t) : t;
          
          const beforeValue = evaluateSchedule(transitionStart - 0.1);
          
          return {
            kelvin: lerp(beforeValue.kelvin, prevKf.kelvin, progress),
            dim: lerp(beforeValue.dim, prevKf.dim, progress),
            transition: prevKf.transitionSeconds
          };
        }
        
        // After transition is complete
        if (timeMinutes >= transitionEnd) {
          // Check if NEXT keyframe is interpolate
          // If yes, interpolate to it from this transition's end
          const prevIndex = prevKf.index;
          
          // Find next interpolate keyframe
          let nextInterpolateKf = null;
          let nextInterpolateTime = null;
          
          for (let i = prevIndex + 1; i < sorted.length; i++) {
            if (sorted[i].mode === 'interpolate') {
              nextInterpolateKf = sorted[i];
              nextInterpolateTime = parseTime(nextInterpolateKf.time);
              break;
            }
          }
          
          // Wrap-around
          if (!nextInterpolateKf && state.wrapAround) {
            for (let i = 0; i < prevIndex; i++) {
              if (sorted[i].mode === 'interpolate') {
                nextInterpolateKf = sorted[i];
                nextInterpolateTime = parseTime(nextInterpolateKf.time) + 1440;
                break;
              }
            }
          }
          
          // If next is interpolate, interpolate to it
          if (nextInterpolateKf && timeMinutes < nextInterpolateTime) {
            const startTime = transitionEnd;
            const endTime = nextInterpolateTime;
            const duration = endTime - startTime;
            const elapsed = timeMinutes - startTime;
            const t = clamp(elapsed / duration, 0, 1);
            const progress = prevKf.curve === 'sinus' ? easeSinus(t) : t;
            
            return {
              kelvin: lerp(prevKf.kelvin, nextInterpolateKf.kelvin, progress),
              dim: lerp(prevKf.dim, nextInterpolateKf.dim, progress),
              transition: state.stepMinutes * 60
            };
          }
          
          // No next interpolate or already past it - hold value
          return { 
            kelvin: prevKf.kelvin, 
            dim: prevKf.dim, 
            transition: prevKf.transitionSeconds 
          };
        }
      }

      if (prevKf.mode === 'interpolate') {
        // Interpolate: defines TARGET value at TARGET time
        // Interpolates from previous keyframe to THIS keyframe
        // THEN checks if next is also interpolate to continue
        
        const prevIndex = prevKf.index;
        
        // PART 1: Are we BEFORE this keyframe? Interpolate TO it
        if (timeMinutes < prevKf.timeMinutes) {
          // Find interpolation START point
          let startTime = 0;
          let startKelvin = prevKf.kelvin;
          let startDim = prevKf.dim;
          
          if (prevIndex > 0) {
            const beforeKf = sorted[prevIndex - 1];
            const beforeTime = parseTime(beforeKf.time);
            
            startKelvin = beforeKf.kelvin;
            startDim = beforeKf.dim;
            
            // If previous was transition, start after it ends
            if (beforeKf.mode === 'transition') {
              const transDuration = beforeKf.transitionSeconds / 60;
              const direction = beforeKf.transitionDirection || 'after';
              
              if (direction === 'after') {
                startTime = beforeTime + transDuration;
              } else {
                startTime = beforeTime;
              }
            } else {
              startTime = beforeTime;
            }
          }
          
          // Interpolate to THIS keyframe
          const endTime = prevKf.timeMinutes;
          const duration = endTime - startTime;
          
          if (duration <= 0) {
            return {
              kelvin: prevKf.kelvin,
              dim: prevKf.dim,
              transition: state.stepMinutes * 60
            };
          }
          
          const elapsed = timeMinutes - startTime;
          const t = clamp(elapsed / duration, 0, 1);
          const progress = prevKf.curve === 'sinus' ? easeSinus(t) : t;
          
          return {
            kelvin: lerp(startKelvin, prevKf.kelvin, progress),
            dim: lerp(startDim, prevKf.dim, progress),
            transition: state.stepMinutes * 60
          };
        }
        
        // PART 2: We're AT or AFTER this keyframe
        // Check if NEXT keyframe is also interpolate
        if (!nextKf) {
          // No next keyframe - hold
          return {
            kelvin: prevKf.kelvin,
            dim: prevKf.dim,
            transition: prevKf.transitionSeconds
          };
        }
        
        // If next is NOT interpolate, hold until next keyframe
        if (nextKf.mode !== 'interpolate') {
          return {
            kelvin: prevKf.kelvin,
            dim: prevKf.dim,
            transition: prevKf.transitionSeconds
          };
        }
        
        // PART 3: Next is ALSO interpolate - continue interpolating
        const nextInterpolateTime = nextKf.timeMinutes;
        
        // Check for transitions/instants BETWEEN this and next
        let startTime = prevKf.timeMinutes;
        let startKelvin = prevKf.kelvin;
        let startDim = prevKf.dim;
        
        for (let i = prevIndex + 1; i < sorted.length; i++) {
          const kf = sorted[i];
          const kfTime = parseTime(kf.time);
          
          if (kfTime >= nextInterpolateTime) break;
          
          if (kf.mode === 'transition') {
            const transDuration = kf.transitionSeconds / 60;
            const direction = kf.transitionDirection || 'after';
            
            if (direction === 'after') {
              startTime = kfTime + transDuration;
            } else {
              startTime = kfTime;
            }
            startKelvin = kf.kelvin;
            startDim = kf.dim;
          } else if (kf.mode === 'instant') {
            startTime = kfTime;
            startKelvin = kf.kelvin;
            startDim = kf.dim;
          }
        }
        
        // Interpolate to next interpolate keyframe
        const endTime = nextInterpolateTime;
        
        if (timeMinutes < startTime) {
          return {
            kelvin: startKelvin,
            dim: startDim,
            transition: state.stepMinutes * 60
          };
        }
        
        if (timeMinutes >= endTime) {
          return {
            kelvin: nextKf.kelvin,
            dim: nextKf.dim,
            transition: state.stepMinutes * 60
          };
        }
        
        // During interpolation to next
        const duration = endTime - startTime;
        const elapsed = timeMinutes - startTime;
        const t = clamp(elapsed / duration, 0, 1);
        const progress = nextKf.curve === 'sinus' ? easeSinus(t) : t;
        
        return {
          kelvin: lerp(startKelvin, nextKf.kelvin, progress),
          dim: lerp(startDim, nextKf.dim, progress),
          transition: state.stepMinutes * 60
        };
      }

      return { 
        kelvin: prevKf.kelvin, 
        dim: prevKf.dim, 
        transition: prevKf.transitionSeconds 
      };
    }

    // ============================================================================
    // CHART
    // ============================================================================

    let chart = null;

    function renderChart() {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');

      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      const stepMinutes = Math.max(1, state.stepMinutes);
      const horizonMinutes = state.horizonHours * 60;
      
      // IMPORTANT: Chart uses higher resolution for visualization
      // User's stepMinutes is for HA update frequency, NOT chart resolution
      // Use 0.5 min (30 sec) for smooth chart, regardless of stepMinutes setting
      const chartStepMinutes = 0.5;
      const steps = Math.ceil(horizonMinutes / chartStepMinutes);

      const labels = [];
      const kelvinData = [];
      const dimData = [];
      const transitionData = [];
      const timeData = []; // Store actual time objects for tooltips
      
      // For normalized display (0-100%)
      const kelvinNormalizedData = [];
      const dimNormalizedData = [];

      // Calculate label frequency based on horizon
      // For 24h: show every 2 hours, for 48h: every 4 hours, for 72h: every 6 hours
      const labelInterval = state.horizonHours <= 24 ? 120 : state.horizonHours <= 48 ? 240 : 360;

      for (let i = 0; i <= steps; i++) {
        const minutes = i * chartStepMinutes;
        const time = new Date(startOfDay.getTime() + minutes * 60000);
        timeData.push(time);
        
        // Show label at calculated intervals
        const showLabel = minutes % labelInterval === 0;
        labels.push(showLabel ? time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '');

        const timeOfDay = (time.getHours() * 60 + time.getMinutes()) % 1440;
        const values = evaluateSchedule(timeOfDay);
        
        kelvinData.push(values.kelvin);
        dimData.push(values.dim);
        transitionData.push(values.transition);
        
        // Normalize Kelvin: 2000-6500 â 0-100%
        const kelvinNormalized = ((values.kelvin - 2000) / (6500 - 2000)) * 100;
        kelvinNormalizedData.push(kelvinNormalized);
        
        // Dim is already 0-100%
        dimNormalizedData.push(values.dim);
      }

      if (chart) {
        chart.destroy();
      }

      // Store these for grid callback
      const gridConfig = {
        chartStepMinutes: chartStepMinutes,
        labelInterval: labelInterval
      };

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: t('chart_brightness'),
              data: dimNormalizedData,
              borderColor: '#2196F3',
              backgroundColor: 'rgba(33, 150, 243, 0.1)',
              yAxisID: 'y',
              tension: 0  // No smoothing - show actual data points
            },
            {
              label: t('chart_kelvin'),
              data: kelvinNormalizedData,
              borderColor: '#FF9800',
              backgroundColor: 'rgba(255, 152, 0, 0.1)',
              yAxisID: 'y1',
              tension: 0  // No smoothing - show actual data points
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top'
            },
            tooltip: {
              callbacks: {
                title: function(context) {
                  // Show exact time for the data point
                  const index = context[0].dataIndex;
                  const time = timeData[index];
                  return time.toLocaleString('de-DE', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    day: '2-digit',
                    month: '2-digit'
                  });
                },
                label: function(context) {
                  const index = context.dataIndex;
                  const datasetIndex = context.datasetIndex;
                  
                  if (datasetIndex === 0) {
                    // Dim dataset
                    return `Helligkeit: ${dimData[index].toFixed(1)}%`;
                  } else {
                    // Kelvin dataset
                    return `Kelvin: ${Math.round(kelvinData[index])} K`;
                  }
                },
                afterBody: function(context) {
                  // Show transition time
                  const index = context[0].dataIndex;
                  return [``, `Transition: ${transitionData[index]}s`];
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                maxRotation: 0,
                minRotation: 0,
                autoSkip: false,
                font: {
                  size: 11
                }
              },
              grid: {
                display: true,
                color: function(context) {
                  // Grid lines at label intervals
                  const index = context.index;
                  const minutes = index * gridConfig.chartStepMinutes;
                  if (minutes % gridConfig.labelInterval === 0) {
                    return 'rgba(0, 0, 0, 0.15)';
                  }
                  return 'rgba(0, 0, 0, 0)'; // Hide other grid lines
                }
              }
            },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              title: {
                display: true,
                text: 'Helligkeit %'
              },
              min: 0,
              max: 100
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              title: {
                display: true,
                text: 'Kelvin (normalisiert)'
              },
              min: 0,
              max: 100,
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });

      // Update stats
      updateStats(kelvinData, dimData, transitionData);
    }

    function updateStats(kelvinData, dimData, transitionData) {
      const avgKelvin = Math.round(kelvinData.reduce((a, b) => a + b, 0) / kelvinData.length);
      const avgDim = Math.round(dimData.reduce((a, b) => a + b, 0) / dimData.length);
      const avgTransition = Math.round(transitionData.reduce((a, b) => a + b, 0) / transitionData.length);

      document.getElementById('stats').innerHTML = `
        <div class="stat-item">
          <span class="stat-label">Keyframes:</span>
          <span>${state.keyframes.length}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Ã Kelvin:</span>
          <span>${avgKelvin} K</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Ã Helligkeit:</span>
          <span>${avgDim}%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Ã Transition:</span>
          <span>${avgTransition}s</span>
        </div>
      `;
    }

    // EXPORT / IMPORT
    // ============================================================================

    function generateHaJson() {
      return {
        version: 1,
        name: state.scheduleName || 'My Schedule',  // Metadata: WebApp verwendet es fÃ¼r Dateinamen/Titel
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Berlin",
        stepMinutes: state.stepMinutes,
        horizonHours: state.horizonHours,
        wrapAround: state.wrapAround,
        startDateTime: null,
        keyframes: state.keyframes.map(kf => {
          return {
            time: kf.time,
            kelvin: kf.kelvin,
            dim: kf.dim,
            mode: kf.mode,
            curve: kf.curve,
            transitionSeconds: kf.transitionSeconds,
            transitionDirection: kf.transitionDirection || 'after'
          };
        })
      };
    }

    function updateJsonOutput() {
      const json = generateHaJson();
      document.getElementById('jsonOutput').value = JSON.stringify(json, null, 2);
    }

    function downloadJson() {
      const json = JSON.stringify(generateHaJson(), null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      // Use schedule name for filename (sanitized)
      const safeName = (state.scheduleName || 'My Schedule')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
      a.download = `${safeName}-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadCsv() {
      // Generate CSV with schedule values
      const stepMinutes = Math.max(1, state.stepMinutes);
      const horizonMinutes = state.horizonHours * 60;
      const chartStepMinutes = 0.5; // 30 second resolution
      const steps = Math.ceil(horizonMinutes / chartStepMinutes);
      
      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      // CSV Header
      let csv = 'Zeit,Kelvin,Helligkeit %,Transition (s)\n';
      
      // Generate data points
      for (let i = 0; i <= steps; i++) {
        const minutes = i * chartStepMinutes;
        const time = new Date(startOfDay.getTime() + minutes * 60000);
        const timeStr = time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        const timeOfDay = (time.getHours() * 60 + time.getMinutes() + time.getSeconds() / 60) % 1440;
        const values = evaluateSchedule(timeOfDay);
        
        csv += `${timeStr},${Math.round(values.kelvin)},${Math.round(values.dim)},${values.transition}\n`;
      }
      
      // Download
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `keyframe-schedule-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

        { title: '', text: '' },
        { title: t('pdf_curves_title'), text: '' },
        { title: t('pdf_linear_title'), text: t('pdf_linear_desc') },
        { title: t('pdf_sinus_title'), text: t('pdf_sinus_desc') },
        { title: '', text: '' },
        { title: t('pdf_transition_time_title'), text: '' },
        { title: t('mode_interpolate'), text: t('pdf_interpolate_time_desc') },
        { title: `${t('mode_transition')}/${t('mode_instant')}`, text: t('pdf_transition_any_desc') }
      ];
      
      explanations.forEach(exp => {
        if (exp.title === '' && exp.text === '') {
          yPos += 5;
          return;
        }
        
        if (exp.title && !exp.text) {
          doc.setFont(undefined, 'bold');
          doc.text(exp.title, margin, yPos);
          doc.setFont(undefined, 'normal');
          yPos += 7;
          return;
        }
        
        if (exp.title) {
          doc.setFont(undefined, 'bold');
          doc.text(exp.title + ':', margin, yPos);
          doc.setFont(undefined, 'normal');
          yPos += 5;
        }
        
        const lines = doc.splitTextToSize(exp.text, pageWidth - 2 * margin - 5);
        lines.forEach(line => {
          if (yPos > doc.internal.pageSize.getHeight() - 20) {
            doc.addPage();
            yPos = 20;
          }
          doc.text(line, margin + (exp.title ? 5 : 0), yPos);
          yPos += 5;
        });
        
        yPos += 3;
      });
      
      // Save
      // Use schedule name for filename (sanitized)
      const safeName = (state.scheduleName || 'My Schedule')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
      doc.save(`${safeName}-${new Date().toISOString().split('T')[0]}.pdf`);
    }

    function importJson() {
      document.getElementById('fileInput').click();
    }

    function loadFileTop() {
      document.getElementById('fileInputTop').click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          
          if (json.version === 1 && json.keyframes) {
            state.scheduleName = json.name || 'My Schedule';  // Load name from JSON
            state.stepMinutes = json.stepMinutes || 5;
            state.horizonHours = json.horizonHours || 48;
            state.wrapAround = json.wrapAround !== false;
            state.keyframes = json.keyframes.map(kf => {
              return {
                time: kf.time,
                kelvin: kf.kelvin,
                dim: kf.dim,
                mode: kf.mode || 'instant',
                curve: kf.curve || 'linear',
                transitionSeconds: kf.transitionSeconds || 300,
                transitionDirection: kf.transitionDirection || 'after'
              };
            });
            
            saveState();
            updateUI();
            alert('â Zeitplan erfolgreich importiert!');
          } else {
            alert('â UngÃ¼ltiges JSON-Format');
          }
        } catch (err) {
          console.error('Import error:', err);
          alert('â Fehler beim Importieren der Datei');
        }
      };
      reader.readAsText(file);
      
      // Reset file input
      event.target.value = '';
    }

    function importFromText() {
      try {
        const json = JSON.parse(document.getElementById('jsonOutput').value);
        
        if (json.version === 1 && json.keyframes) {
          state.stepMinutes = json.stepMinutes || 5;
          state.horizonHours = json.horizonHours || 48;
          state.wrapAround = json.wrapAround !== false;
          state.keyframes = json.keyframes.map(kf => {
            return {
              time: kf.time,
              kelvin: kf.kelvin,
              dim: kf.dim,
              mode: kf.mode || 'instant',
              curve: kf.curve || 'linear',
              transitionSeconds: kf.transitionSeconds || 300,
              transitionDirection: kf.transitionDirection || 'after'
            };
          });
          
          saveState();
          updateUI();
          alert('â JSON erfolgreich Ã¼bernommen!');
        } else {
          alert('â UngÃ¼ltiges JSON-Format');
        }
      } catch (err) {
        console.error('Import error:', err);
        alert('â UngÃ¼ltiges JSON');
      }
    }

    // ============================================================================
    // EVENT LISTENERS
    // ============================================================================

    document.getElementById('stepMinutes').addEventListener('change', (e) => {
      state.stepMinutes = Math.max(1, Math.min(60, parseInt(e.target.value) || 5));
      saveState();
      renderChart();
      updateJsonOutput();
    });

    document.getElementById('horizonHours').addEventListener('change', (e) => {
      state.horizonHours = parseInt(e.target.value);
      saveState();
      renderChart();
      updateJsonOutput();
    });

    document.getElementById('wrapAround').addEventListener('change', (e) => {
      state.wrapAround = e.target.value === 'true';
      saveState();
      renderChart();
      updateJsonOutput();
    });

    document.getElementById('addKeyframeBtn').addEventListener('click', addKeyframe);
    document.getElementById('sortByTimeBtn').addEventListener('click', sortKeyframesByTime);
    document.getElementById('loadPresetBtn').addEventListener('click', () => loadPreset('example'));
    document.getElementById('loadFileBtn').addEventListener('click', loadFileTop);
    document.getElementById('fileInputTop').addEventListener('change', handleFileImport);
    document.getElementById('downloadJsonBtn').addEventListener('click', downloadJson);
    document.getElementById('downloadPdfBtn').addEventListener('click', downloadPdf);
    document.getElementById('downloadCsvBtn').addEventListener('click', downloadCsv);
    document.getElementById('importFromTextBtn').addEventListener('click', importFromText);

    // ============================================================================
    // INITIALIZATION
    // ============================================================================

    loadState();
    setLanguage(currentLang);  // Initialize i18n
  </script>

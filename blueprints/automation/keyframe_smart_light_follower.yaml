# blueprint_version: 1.0
blueprint:
  name: "Keyframe Scheduler"
  description: |
    Keyframe Scheduler Follower v1.0

    Applies Keyframe Scheduler values to any light entity.
    Works with regular HA lights and PICOlightnode lights.

    FOLLOW SWITCH (optional)
    Controls whether this light follows the schedule.
    Without it, the light always follows.

    - PICOlightnode: select the existing "Follow External Automation" switch
    - Regular lights: select an auto-generated switch from the Keyframe Scheduler
      instance (configure via Settings → Keyframe Scheduler → Follow Lights)

    MANUAL OVERRIDE DETECTION
    When the light is changed manually via dashboard or app, the follow switch
    is automatically turned off. Uses HA context (user_id / parent_id) to
    distinguish real user actions from automation updates.

    AUTO-RESUME
    Set a duration in minutes. After a manual override, the follow switch is
    automatically re-enabled. Uses the switch's last_changed timestamp —
    no helper entity required.

  domain: automation

  input:
    scheduler_sensor:
      name: Keyframe Scheduler Sensor
      description: >
        Select any sensor from the Keyframe Scheduler instance
        (Target Kelvin, Target Brightness, etc.).
        The companion sensors are auto-detected.
      selector:
        entity:
          filter:
            - integration: keyframe_scheduler
              domain: sensor
          multiple: false

    target_light:
      name: Target Light
      description: Which light should follow the schedule?
      selector:
        entity:
          domain: light

    follow_switch:
      name: Follow Switch (optional)
      description: >
        Switch that controls whether this light follows the schedule.
        Leave empty to always follow (no manual override detection).
      default: ""
      selector:
        entity:
          domain: switch

    auto_resume_minutes:
      name: Auto-Resume after manual override
      description: >
        Minutes until following resumes automatically after a manual override.
        Set to 0 to disable auto-resume.
      default: 0
      selector:
        number:
          min: 0
          max: 480
          step: 5
          unit_of_measurement: min
          mode: slider

    sync_on_enable:
      name: Sync immediately when follow switch is turned ON
      description: >
        Jump to current schedule values (3s transition) when the follow switch
        is turned on.
      default: true
      selector:
        boolean:

variables:
  scheduler_sensor_id: !input scheduler_sensor
  light_entity: !input target_light
  follow_id: !input follow_switch
  auto_resume_min: !input auto_resume_minutes
  sync_enable: !input sync_on_enable

  # True if a follow switch is configured
  has_follow: "{{ follow_id not in ('', none) }}"

  # Extract instance name from sensor entity_id
  # "sensor.besprechung_target_kelvin" → "besprechung"
  instance: >-
    {% set ns = namespace(s=scheduler_sensor_id | replace('sensor.', '')) %}
    {% for suffix in ['_target_kelvin', '_target_brightness', '_target_mired', '_next_change'] %}
      {% if ns.s.endswith(suffix) %}
        {% set ns.s = ns.s[: -(suffix | length)] %}
      {% endif %}
    {% endfor %}
    {{ ns.s }}

  kelvin_sensor: "sensor.{{ instance }}_target_kelvin"
  brightness_sensor: "sensor.{{ instance }}_target_brightness"

trigger:
  # Trigger 1: Keyframe Scheduler updated
  - platform: state
    entity_id: !input scheduler_sensor
    id: scheduler_update

  # Trigger 2+3: Light attribute changed (manual override detection)
  - platform: state
    entity_id: !input target_light
    attribute: brightness
    id: light_changed

  - platform: state
    entity_id: !input target_light
    attribute: color_temp_kelvin
    id: light_changed

  # Trigger 4: Follow switch turned ON → sync to schedule
  - platform: state
    entity_id: !input follow_switch
    to: "on"
    id: follow_enabled

  # Trigger 5: Periodic check for auto-resume (every minute)
  - platform: time_pattern
    minutes: "*"
    id: auto_resume_check

condition: []

action:
  - choose:

      # ──────────────────────────────────────────────────────────────
      # CASE 1: Manual override detected → turn follow switch off
      # ──────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: light_changed

          # Only when follow switch is configured and currently ON
          - condition: template
            value_template: "{{ has_follow and is_state(follow_id, 'on') }}"

          # Light must be on (ignore off→on transitions)
          - condition: state
            entity_id: !input target_light
            state: "on"

          # True manual action: has a user, not triggered by an automation
          - condition: template
            value_template: >
              {% set ctx = trigger.to_state.context %}
              {{ ctx.user_id is not none and ctx.parent_id is none }}

        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ follow_id }}"

      # ──────────────────────────────────────────────────────────────
      # CASE 2: Follow switch turned ON → sync light to schedule
      # ──────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: follow_enabled
          - condition: template
            value_template: "{{ sync_enable }}"

        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              color_temp_kelvin: "{{ states(kelvin_sensor) | int(3000) }}"
              brightness_pct: "{{ states(brightness_sensor) | float(50) }}"
              transition: 3

      # ──────────────────────────────────────────────────────────────
      # CASE 3: Auto-resume check → re-enable follow switch
      # ──────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: auto_resume_check
          - condition: template
            value_template: >
              {{ has_follow
                 and auto_resume_min | int(0) > 0
                 and is_state(follow_id, 'off') }}
          # Check elapsed time using the switch's own last_changed timestamp
          - condition: template
            value_template: >
              {% set off_since = states[follow_id].last_changed %}
              {% set minutes_off = (now() - off_since).total_seconds() / 60 %}
              {{ minutes_off >= auto_resume_min | int(0) }}

        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ follow_id }}"

      # ──────────────────────────────────────────────────────────────
      # CASE 4: Scheduler updated → apply values to light
      # ──────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: scheduler_update
          # Apply only when following is active (or no follow switch configured)
          - condition: template
            value_template: "{{ not has_follow or is_state(follow_id, 'on') }}"

        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              color_temp_kelvin: "{{ states(kelvin_sensor) | int(3000) }}"
              brightness_pct: "{{ states(brightness_sensor) | float(50) }}"
              transition: "{{ state_attr(kelvin_sensor, 'transition_seconds') | int(0) }}"

mode: restart
max_exceeded: silent
